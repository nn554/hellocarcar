  <rect x="286" y="485" width="1117" height="104" rx="10" class="white" stroke="#e7ece9"/><rect x="308" y="506" width="66" height="24" rx="12" class="tag"/><text x="341" y="522" text-anchor="middle" class="txt small">售后争议</text><text x="390" y="524" class="txt" font-size="16" font-weight="650">新车维修后问题仍未解决，希望尽快给出答复</text><text x="308" y="559" class="muted small">提车后发现车辆异常，维修两次仍反复出现，和门店沟通后暂未获得明确解决时间…</text><text x="1359" y="524" text-anchor="end" class="muted small">浙江 · 5小时前　　♡ 16</text>
  <rect x="286" y="601" width="1117" height="104" rx="10" class="white" stroke="#e7ece9"/><rect x="308" y="622" width="66" height="24" rx="12" class="tag"/><text x="341" y="638" text-anchor="middle" class="txt small">合同退款</text><text x="390" y="640" class="txt" font-size="16" font-weight="650">合同解除后退款周期超出约定期限</text><text x="308" y="675" class="muted small">双方已确认解除协议，退款申请已提交多日，仍未收到款项及进度说明…</text><text x="1359" y="640" text-anchor="end" class="muted small">江苏 · 昨天　　♡ 12</text>
