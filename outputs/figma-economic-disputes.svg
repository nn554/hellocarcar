<svg xmlns="http://www.w3.org/2000/svg" width="4440" height="2200" viewBox="0 0 4440 2200">
<defs>
 <style>
  .bg{fill:#f5f7f6}.white{fill:#fff}.green{fill:#006438}.deep{fill:#00572f}.mint{fill:#e9f5ee}.line{stroke:#e5ebe7;stroke-width:1}.txt{font-family:Inter,'Microsoft YaHei',Arial,sans-serif;fill:#17231c}.muted{font-family:Inter,'Microsoft YaHei',Arial,sans-serif;fill:#748078}.brand{font-family:Inter,Arial,sans-serif;font-weight:800;fill:#fff}.small{font-size:13px}.body{font-size:15px}.title{font-size:27px;font-weight:750}.h2{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:600}.btn{fill:#006438}.tag{fill:#edf6f0}.pill{fill:#fff;stroke:#dce5df}.shadow{filter:url(#s)}
 </style>
