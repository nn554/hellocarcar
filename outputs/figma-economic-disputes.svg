 <g id="topbar"><rect x="248" width="1192" height="58" fill="#fff"/><line x1="248" y1="58" x2="1440" y2="58" class="line"/><text x="278" y="36" class="txt" font-size="14" font-weight="600">纠纷案件</text><text x="1154" y="36" class="muted small">私有受理　◎　中文　⌄　♧　●</text></g>
 <g id="header">
