<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>汽车出口价 · UI 设计预览</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#182924;background:#eff3f1;font-synthesis:none;letter-spacing:0}*{box-sizing:border-box}body{margin:0}button,input{font:inherit;letter-spacing:0}button{cursor:pointer}header{max-width:1190px;margin:auto;padding:28px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:19px;margin:0;font-weight:600}.tabs{display:flex;gap:4px;background:#e5ebe7;padding:4px;border-radius:8px}.tabs button{border:0;background:none;padding:9px 16px;font-size:12px;color:#60716a;border-radius:5px}.tabs button.active{background:white;color:#147d5e;box-shadow:0 1px 3px #142d2010}main{display:flex;justify-content:center;padding:0 16px 32px}.phone{width:393px;height:852px;position:relative;flex:none;background:white;box-shadow:0 15px 60px #18372514;overflow:hidden}.art{position:absolute;inset:0}.art>svg{width:100%;height:100%;display:block}.hotspot{position:absolute;background:transparent;border:0;border-radius:6px;padding:0}.hotspot:focus-visible{outline:2px solid #147d5e;outline-offset:-2px}.hotspot:hover{background:#147d5e08}.overlay-input{position:absolute;border:0;background:#f8faf9;color:#182924;font-size:13px;outline:0;padding:0}.overlay-input::placeholder{color:#87958f}.history-search{left:59px;top:184px;width:218px;height:26px;font-size:12px}.message-input{left:35px;top:712px;width:286px;height:28px}.filtered-list{position:absolute;left:12px;right:93px;top:230px;bottom:122px;background:white;padding:0 8px;overflow:auto}.history-result{position:relative;width:100%;text-align:left;border:0;background:white;padding:17px 10px;border-bottom:1px solid #e7ece9;font-size:13px;color:#182924}.history-result small{display:block;color:#87958f;margin-top:8px;font-size:10px}.empty{padding:80px 10px;text-align:center;color:#87958f;font-size:13px}.toast{position:absolute;left:35px;right:35px;bottom:177px;background:#182924;color:white;text-align:center;padding:12px;border-radius:6px;font-size:12px;z-index:10}.sheet-mask{position:absolute;inset:104px 0 0;background:#152b2259;z-index:15;display:flex;align-items:flex-end}.sheet{width:100%;max-height:700px;background:white;border-radius:12px 12px 0 0;padding:20px;overflow:auto}.sheet h2{font-size:18px;margin:0 0 16px}.sheet .close{float:right;border:0;background:none;font-size:22px;color:#60716a;line-height:20px}.quote-row{padding:15px 0;border-bottom:1px solid #e7ece9;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px}.quote-row small{display:block;font-size:11px;color:#87958f;margin-top:7px}.quote-row strong{font-size:19px;color:#147d5e;white-space:nowrap}.sheet label{display:block;font-size:12px;color:#60716a;margin:16px 0 6px}.sheet input{width:100%;border:1px solid #e7ece9;border-radius:6px;padding:12px;font-size:15px}.sheet output{display:block;color:#147d5e;font-size:27px;margin:20px 0}.sheet p{font-size:12px;line-height:1.8;color:#60716a}.answer{position:absolute;left:20px;right:20px;top:184px;bottom:170px;background:white;overflow:auto;font-size:14px;line-height:1.9}.answer strong{font-size:20px}.answer .prompt{background:#eaf5ef;padding:12px;border-radius:8px;margin-bottom:24px}.answer p{color:#60716a}.custom-question{position:absolute;left:65px;right:20px;top:120px;min-height:47px;max-height:56px;overflow:hidden;border-radius:8px;background:#eaf5ef;padding:13px;font-size:13px}.note{max-width:700px;text-align:center;margin:0 auto 24px;color:#87958f;font-size:11px;line-height:1.7;padding:0 20px}@media(max-width:600px){header,.note{display:none}main{padding:0}.phone{box-shadow:none}body{background:white}}@media(prefers-reduced-motion:no-preference){.sheet{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:translateY(0);opacity:1}} 
main{width:100%;overflow:hidden}
</style></head>
<body>
<header><h1>汽车出口价 · UI 设计</h1><nav class="tabs" aria-label="设计页面"><button data-view="home">新对话</button><button data-view="quote">车型报价</button><button data-view="history">历史对话</button></nav></header>
<main><div class="phone" id="phone"><div class="art" id="art"></div><div id="controls"></div><div id="floating"></div></div></main>
<p class="note">交互设计预览 · 报价示例取自提供的截图，未接入实时报价服务。<br>SVG 可导入 Figma，保留文字与矢量图层；当前文件未写入 Figma 云端。</p>
<script src="preview-data.js"></script>
<script>
const art=document.querySelector('#art'),controls=document.querySelector('#controls'),floating=document.querySelector('#floating'),phone=document.querySelector('#phone');
let state='home',filter='全部',previous='quote',toastTimer,activeQuestion='',customAnswer='';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function fit(){const scale=Math.min(1,innerWidth/393);phone.style.transform=`scale(${scale})`;phone.style.transformOrigin='top center';phone.parentElement.style.height=(852*scale+32)+'px';}
function hotspot(label,x,y,w,h,fn){const b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',label);b.title=label;Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});b.onclick=fn;controls.append(b);return b;}
function toast(s){clearTimeout(toastTimer);floating.innerHTML='<div class="toast" role="status">'+esc(s)+'</div>';toastTimer=setTimeout(()=>floating.innerHTML='',2400);}
function openSheet(title,body){floating.innerHTML=`<div class="sheet-mask"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="close" aria-label="关闭">×</button><h2>${esc(title)}</h2>${body}</section></div>`;floating.querySelector('.close').onclick=()=>floating.innerHTML='';floating.querySelector('.sheet-mask').onclick=e=>{if(e.target.className==='sheet-mask')floating.innerHTML=''};floating.querySelector('.close').focus();}
function allPrices(){openSheet('吉利缤越 · 全部配置',DESIGN.prices.filter(p=>filter==='全部'||p.color===filter).map(p=>`<div class="quote-row"><div>${esc(p.name)}<small>${p.color}色 · 指导价 ¥${p.guide}</small></div><strong>$${p.usd}</strong></div>`).join('')+'<p>FOB 南沙 · USD / 台 · 示例来自原截图</p>');}
function calculator(){openSheet('车价计算器','<label for="vehicle-price">车辆价格（USD）</label><input id="vehicle-price" type="number" min="0" value="7800"><label for="shipping">海运及其他费用（USD）</label><input id="shipping" type="number" min="0" value="0"><label>合计（USD）</label><output id="total">$7,800</output><p>示意计算，不包含未录入的税费、保险及其他成本。</p>');floating.querySelectorAll('input').forEach(e=>e.oninput=()=>{const a=Math.max(0,Number(document.querySelector('#vehicle-price').value)||0),b=Math.max(0,Number(document.querySelector('#shipping').value)||0);document.querySelector('#total').textContent='$'+(a+b).toLocaleString('en-US',{maximumFractionDigits:2});});}
function account(){openSheet('我的账户','<p>这是设计预览，尚未连接小程序账户。</p><div class="quote-row">历史对话<span>'+DESIGN.historyItems.length+' 条示例</span></div><div class="quote-row">报价单位<span>USD / 台</span></div>');}
function newChat(){activeQuestion='';customAnswer='';filter='全部';render('home');}
function openTopic(title){activeQuestion=title;customAnswer=title.includes('缤越')?'':title.includes('海运')?'海运费用与起运港、目的港、运输方式和发运时间有关。请补充目的港、车辆数量和预计发运日期。':title.includes('阿尔及利亚')||title.includes('政策')?'请补充车辆年份、能源类型和进口主体，以便核对目的国准入要求及所需资料。':title.includes('采购')||title.includes('定金')?'请补充合同约定、付款阶段、交期及目前的争议情况。': '请补充完整车型与配置、颜色和交付地点，以便进一步确认报价。';render('quote');}
function send(){const i=document.querySelector('#message');const q=i.value.trim();if(!q)return;openTopic(q);}
function render(next){state=next;floating.innerHTML='';controls.innerHTML='';art.innerHTML=next==='home'?DESIGN.views['01-new-chat']:next==='history'?DESIGN.views['03-history-drawer']:(filter==='全部'?DESIGN.views['02-quote-chat']:DESIGN.filtered[filter]);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state));
 if(next==='history'){
  hotspot('关闭历史对话',312,104,81,730,()=>render(previous));hotspot('收起侧栏',257,114,44,44,()=>render(previous));hotspot('新建对话',20,177,272,44,newChat);hotspot('收起历史对话',10,49,44,46,()=>render(previous));hotspot('顶部新建对话',241,48,44,44,newChat);
  const input=document.createElement('input');input.type='search';input.className='overlay-input history-search';input.style.top='244px';input.placeholder='搜索历史对话';input.setAttribute('aria-label','搜索历史对话');controls.append(input);
  const rowY=[313,393,447,527,581,661];DESIGN.historyItems.forEach((p,i)=>hotspot('打开：'+p.title,12,rowY[i],288,50,()=>openTopic(p.title)));
  hotspot('对话选项',264,317,36,30,()=>openSheet('吉利缤越 FOB 报价','<div class="quote-row">已置顶</div><p>此对话包含 8 条报价示例。</p>'));
  // Search replaces only the list region, leaving the stable drawer shell in place.
  input.oninput=()=>{document.querySelector('.filtered-list')?.remove();if(!input.value.trim())return;const list=document.createElement('div');list.className='filtered-list';list.style.top='289px';const matches=DESIGN.historyItems.filter(p=>(p.title+p.sub).toLowerCase().includes(input.value.trim().toLowerCase()));if(!matches.length)list.innerHTML='<div class="empty">没有找到相关对话</div>';matches.forEach(p=>{const b=document.createElement('button');b.className='history-result';b.innerHTML=esc(p.title)+'<small>'+esc(p.sub)+'</small>';b.onclick=()=>openTopic(p.title);list.append(b);});controls.append(list);};
  hotspot('我的账户',20,758,236,51,account);hotspot('设置',259,758,44,49,account);return;
 }
 hotspot('打开历史对话',10,49,44,46,()=>{previous=state;render('history')});hotspot('新建对话',241,48,44,44,newChat);
 const input=document.createElement('input');input.id='message';input.className='overlay-input message-input';input.placeholder='询问车型、报价或出口问题…';input.setAttribute('aria-label','输入消息');input.onkeydown=e=>{if(e.key==='Enter')send()};controls.append(input);hotspot('发送消息',326,703,44,44,send);
 hotspot('首页',20,782,91,53,newChat);hotspot('车价计算器',137,782,120,53,calculator);hotspot('我的',283,782,90,53,account);
 if(next==='home'){
  hotspot('查询车型报价',20,279,170,88,()=>openTopic('吉利缤越 FOB 报价'));hotspot('查询出口政策',203,279,170,88,()=>openTopic('查询出口政策'));hotspot('查询海运费用',20,379,170,88,()=>openTopic('查询海运费用'));hotspot('咨询采购纠纷',203,379,170,88,()=>openTopic('咨询采购纠纷'));
  hotspot('询问吉利缤越报价',20,523,353,46,()=>openTopic('吉利缤越 FOB 报价'));hotspot('询问阿尔及利亚资料',20,570,353,44,()=>openTopic('出口阿尔及利亚需要哪些资料？'));hotspot('浏览车型报价库',20,629,353,42,allPrices);
 }else{
  if(activeQuestion){const q=document.createElement('div');q.className='custom-question';q.textContent=activeQuestion;controls.append(q);}
  if(customAnswer){const a=document.createElement('div');a.className='answer';a.innerHTML='<strong>汽车出口价</strong><p>'+esc(customAnswer)+'</p>';controls.append(a);return;}
  ['全部','灰','白'].forEach((s,i)=>hotspot('筛选：'+s,23+i*54,292,54,32,()=>{filter=s;render('quote')}));hotspot('查看全部配置',20,570,353,29,allPrices);
  hotspot('查看报价来源',20,601,216,30,()=>openSheet('报价来源','<p>界面中的吉利缤越价格逐项取自本次提供的原始截图，未对报价进行实时核验。</p><p>实际小程序应在这里展示报价单名称、更新时间及可访问的原始记录。</p>'));
  hotspot('复制报价',290,597,30,37,async()=>{const str=DESIGN.prices.map(p=>`${p.name} ${p.color}色 $${p.usd} FOB 南沙`).join('\n');try{await navigator.clipboard.writeText(str);toast('报价已复制')}catch{openSheet('报价文本','<p style="white-space:pre-wrap">'+esc(str)+'</p>')}});
  hotspot('有帮助',322,597,30,37,()=>toast('已记录：有帮助'));hotspot('需改进',352,597,30,37,()=>toast('已记录：需改进'));hotspot('询问出口资料',20,648,162,30,()=>openTopic('这款车出口需要什么资料？'));hotspot('询问海运费用',190,648,138,30,()=>openTopic('查询海运费用'));
 }
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{activeQuestion='';customAnswer='';render(b.dataset.view)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(floating.innerHTML)floating.innerHTML='';else if(state==='history')render(previous)}});addEventListener('resize',fit);fit();render(new URLSearchParams(location.search).get('view')||'home');
</script></body></html>
